version: '3.8'

services:
  vault:
    image: hashicorp/vault:1.20.0
    container_name: vault-dev
    ports:
      - "8200:8200"
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: root
      VAULT_DEV_LISTEN_ADDRESS: "0.0.0.0:8200"
    cap_add:
      - IPC_LOCK
    command: "server -dev"

  source-management-mongo-db:
    image: mongo:6
    container_name: source-management-mongo-db
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
      - ./local-mongo-init:/docker-entrypoint-initdb.d:ro

  source-management-postgres:
    image: postgres:15
    container_name: source-management-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: source-management
    ports:
      - "5432:5432"
    volumes:
      - source_management_postgres_data:/var/lib/postgresql/data

  admin-panel-postgres:
    image: postgres:15
    container_name: admin-panel-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: admin_panel
      PGPORT: 5433
    ports:
      - "5433:5433"
    volumes:
      - admin_panel_postgres_data:/var/lib/postgresql/data

  source-management:
    build:
      context: ./source_management
      dockerfile: Dockerfile
    container_name: source-management
    ports:
      - "8000:8000"
    environment:
      CONTAINER_TYPE: fastapi
      ENVIRONMENT: dev
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@source-management-postgres:5432/source-management
      MONGO_URI: mongodb://source-management-mongo-db:27017
      VAULT_ADDR: http://vault:8200
    depends_on:
      - source-management-postgres
      - source-management-migrator
      - source-management-mongo-db
    restart: unless-stopped

  conversation:
    build:
      context: ./conversation
      dockerfile: Dockerfile
    container_name: conversation
    ports:
      - "8001:8000"
    environment:
      CONTAINER_TYPE: fastapi
      ENVIRONMENT: dev
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@admin-panel-postgres:5433/admin_panel
      MONGO_URI: mongodb://source-management-mongo-db:27017
    restart: unless-stopped

  admin-panel:
    build:
      context: ./admin_panel
      dockerfile: Dockerfile
    container_name: admin-panel
    ports:
      - "8002:8000"
    environment:
      CONTAINER_TYPE: fastapi
      ENVIRONMENT: dev
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@admin-panel-postgres:5433/admin_panel
    depends_on:
      - admin-panel-postgres
      - admin-panel-migrator
    restart: unless-stopped

  source-management-migrator:
    build:
      context: ./source_management
      dockerfile: Dockerfile
    container_name: source-management-migrator
    depends_on:
      - source-management-postgres
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@source-management-postgres:5432/source-management
    entrypoint: >
      bash -c "alembic upgrade head"
    restart: "no"

  admin-panel-migrator:
    build:
      context: ./admin_panel
      dockerfile: Dockerfile
    container_name: admin-panel-migrator
    depends_on:
      - admin-panel-postgres
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@admin-panel-postgres:5433/admin_panel
    entrypoint: >
      bash -c "alembic upgrade head"
    restart: "no"

  api-gateway:
    build:
      context: ./api_gateway
      dockerfile: ./Dockerfile
    ports:
      - "8003:8000"
    environment:
      VAULT_URL: http://vault:8200
      VAULT_TOKEN: root
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID}
      FIREBASE_PRIVATE_KEY: ${FIREBASE_PRIVATE_KEY}
      FIREBASE_CLIENT_EMAIL: ${FIREBASE_CLIENT_EMAIL}
      ADMIN_PANEL_URL: http://admin-panel:8000
      SOURCE_MANAGEMENT_URL: http://source-management:8000
      CONVERSATION_URL: http://conversation:8000
      CONTAINER_TYPE: fastapi
      ENVIRONMENT: production
    depends_on:
      - vault
      - admin-panel
      - source-management
      - conversation
    restart: unless-stopped

  vectorization_core:
    build:
      context: ./vectorization_core
      dockerfile: Dockerfile
    container_name: vectorization-core
    ports:
      - "8010:8000"
    environment:
      CONTAINER_TYPE: fastapi
      ENVIRONMENT: dev
    deploy:
      resources:
        limits:
          memory: 50G
        reservations:
          memory: 16G

  ui:
    build:
      context: ./ui
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - api-gateway
    restart: unless-stopped

  opensearch:
    image: opensearchproject/opensearch:latest
    container_name: opensearch
    environment:
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - "OPENSEARCH_JAVA_OPTS=-Xms1g -Xmx1g"
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=MyStrongPassword123!
      - plugins.security.disabled=true
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    ports:
      - "9200:9200"
      - "9600:9600"

  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:latest
    container_name: opensearch-dashboards
    ports:
      - "5601:5601"
    environment:
      - OPENSEARCH_HOSTS=["https://opensearch:9200"]
      - DISABLE_SECURITY_DASHBOARDS_PLUGIN=false
    depends_on:
      - opensearch


volumes:
  source_management_postgres_data:
  admin_panel_postgres_data:
  mongo_data:
  opensearch-data:
